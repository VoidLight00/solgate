name: ✨ Feature Request
description: 새 기능이나 개선을 제안합니다
title: "[feat]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 어떤 문제를 해결하나요?
      description: "이 기능이 없어서 겪는 불편을 적어주세요."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 제안하는 해결책
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 고려한 대안
  - type: checkboxes
    id: scope
    attributes:
      label: 확인
      options:
        - label: 기존 이슈를 검색했고 중복이 아닙니다
          required: true
